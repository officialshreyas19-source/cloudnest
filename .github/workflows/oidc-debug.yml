name: oidc-debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC claims and try the role (no token or credentials are printed)
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $((${#P} % 4)) -ne 0 ]; do P="${P}="; done
          echo "$P" | base64 -d | jq '{sub, aud, ref, repository, repository_owner}'
          echo "Role used: $ROLE"
          aws sts assume-role-with-web-identity --role-arn "$ROLE" --role-session-name oidc-debug --web-identity-token "$TOKEN" --region ap-south-1 --query "Credentials.Expiration" --output text || true
