name: oidc-debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC claims (the token itself is not printed)
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $((${#P} % 4)) -ne 0 ]; do P="${P}="; done
          echo "$P" | base64 -d | jq '{sub, aud, ref, repository}'
